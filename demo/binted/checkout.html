<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BINTED - Validation Commande</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="fa/css/all.min.css">
<link rel="stylesheet" href="demo.css">
<script src="demo.js" defer></script>
</head>
<body>

<header>
    <nav>
        <a href="index.html" class="logo"><img src="./img/logoSiteT.png" alt="Logo" class="logo-img"> BINTED</a>
        <ul class="nav-links">
            <li><a href="shop.html"><i class="fas fa-arrow-left"></i> Retour Boutique</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <div class="checkout-grid">
        
        <div class="checkout-summary">
            <h2 class="mb-1">Récapitulatif</h2>
            <div class="order-list">
                                    <div class="order-item">
                        <span>__ITEM__</span>
                        <strong>9091€</strong>
                    </div>
                            </div>

            <div class="order-total">
                <span>Total à payer</span>
                <span>9091€</span>
            </div>
            
            <p class="text-muted mt-1" style="font-size: 0.85rem;">
                <i class="fas fa-info-circle"></i> Simulation de paiement pour projet SAE. Aucun débit réel.
            </p>
        </div>

        <div class="checkout-form-container">
            <h2 class="mb-1">Adresse de livraison</h2>
            
            <form action="traitement_commande.php" method="POST" class="modern-form">
                
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Prénom</label>
                        <input type="text" name="prenom" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Nom</label>
                        <input type="text" name="nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email (pour le reçu)</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Adresse complète</label>
                    <textarea name="adresse" rows="3" required placeholder="N°, Rue, Code Postal, Ville..."></textarea>
                </div>

                <button type="submit" class="btn-full" style="background-color: var(--primary);">
                    Valider la commande <i class="fas fa-check"></i>
                </button>
            </form>
        </div>

    </div>
</div>
</body>
</html>
